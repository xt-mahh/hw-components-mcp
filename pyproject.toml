[project]
name = "hw-components-mcp"
version = "0.1.0"
description = "Electronic component search MCP server: LCSC (立创商城), JD IC mall (京东元器件), HQChip (华秋商城)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xt_mahh", email = "xt_mahh@outlook.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "electronic-components",
    "lcsc",
    "hqchip",
    "jd",
    "eda",
    "bom",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "fastmcp>=2.11.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
]

[project.urls]
Homepage = "https://github.com/xt-mahh/hw-components-mcp"
Repository = "https://github.com/xt-mahh/hw-components-mcp"
Issues = "https://github.com/xt-mahh/hw-components-mcp/issues"

[project.scripts]
hw-components-mcp = "hw_components_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hw_components_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
